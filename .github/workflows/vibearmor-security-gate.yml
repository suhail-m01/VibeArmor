name: VibeArmor Deterministic Security Gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  security-gate:
    name: AST + Security RAG + Policy Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11+
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VibeArmor Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Deterministic Cross-Layer Security Scan & Policy Check
        run: |
          vibearmor guard .

      - name: Run Full Verification & Regression Test Suite
        run: |
          python -m unittest tests/test_vibearmor_e2e.py -v
