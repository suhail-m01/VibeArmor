[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibearmor"
version = "3.5.0"
description = "Evidence-Driven Agentic Security & Closed-Loop Neuro-Symbolic Verification for AI-Generated Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Syed Suhail" },
  { name = "Alam Nawaz Sha" },
  { name = "Vivek Gowda" },
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "sqlglot>=23.0.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "watchfiles>=0.21.0",
  "mcp>=1.0.0",
  "bandit>=1.7.8",
  "python-multipart>=0.0.9",
  "langgraph>=0.2.0",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.0",
]

[project.scripts]
vibearmor = "core.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]
